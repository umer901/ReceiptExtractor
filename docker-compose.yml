services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: receipt
      POSTGRES_PASSWORD: receipt
      POSTGRES_DB: receipts
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipt -d receipts"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: api }
    command: npm run db:migrate:prod -w @receipt/api
    environment:
      DATABASE_URL: postgres://receipt:receipt@postgres:5432/receipts
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgres://receipt:receipt@postgres:5432/receipts
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: { context: ., target: web }
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
